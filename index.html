<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Ludo</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#111827,#243b65);font-family:system-ui,Arial;color:white;text-align:center}h1{margin:14px 0 4px}.app{max-width:680px;margin:auto;padding:10px}.controls{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px}button,select{border:0;border-radius:10px;padding:11px 15px;font-weight:700;font-size:15px}button{cursor:pointer;background:#facc15;color:#111827}button:disabled{opacity:.45}#board{display:grid;grid-template-columns:repeat(15,1fr);aspect-ratio:1;width:100%;background:white;border:4px solid #eee;border-radius:5px;overflow:hidden}.cell{position:relative;border:1px solid #0002;display:grid;place-items:center;min-width:0}.red{background:#ef4444}.green{background:#22c55e}.yellow{background:#facc15}.blue{background:#3b82f6}.base{border:0}.base.red{background:#fca5a5}.base.green{background:#86efac}.base.yellow{background:#fde68a}.base.blue{background:#93c5fd}.yard{background:white;border-radius:50%;width:75%;height:75%;display:grid;place-items:center}.safe:after{content:'★';position:absolute;color:#64748b;font-size:clamp(8px,2.5vw,17px);opacity:.55}.center{background:conic-gradient(#22c55e 0 90deg,#facc15 90deg 180deg,#3b82f6 180deg 270deg,#ef4444 270deg);border:0}.token{position:relative;z-index:2;width:78%;height:78%;border-radius:50%;border:2px solid white;box-shadow:0 2px 4px #0008;color:white;font-size:clamp(8px,2.4vw,16px);font-weight:900;display:grid;place-items:center;cursor:pointer;text-shadow:0 1px 2px #0008}.token.yellow{color:#382b00;text-shadow:none}.token.can{outline:3px solid #111;animation:pulse .65s infinite alternate}@keyframes pulse{to{transform:scale(.82)}}.stack{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;height:100%;position:relative;z-index:3}.stack .token{width:48%;height:48%;font-size:10px}.panel{background:#ffffff17;border:1px solid #ffffff3b;border-radius:15px;padding:12px;margin:10px 0}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.player{padding:8px 3px;border-radius:8px;background:#ffffff20;font-size:13px}.player.active{outline:3px solid white}.dice{font-size:40px;display:inline-block;min-width:55px}#status{min-height:42px;font-weight:700}.help{font-size:13px;color:#dbeafe;line-height:1.6}
</style></head><body><div class="app"><h1>👑 Royal Ludo 🎲</h1><div class="controls"><label>Players <select id="mode"><option value="2">2 Players</option><option value="4" selected>4 Players</option></select></label><button id="new">New Game</button><button id="sound">🔊 Sound On</button></div><div class="players" id="players"></div><div class="panel"><div id="status" aria-live="polite"></div><span class="dice" id="dice">🎲</span> <button id="roll">ROLL DICE</button></div><div id="board" aria-label="Ludo board"></div><p class="help">Roll a 6 to release a token. Tap a glowing token to move. Exact roll is needed to finish. Stars and colored starting squares are safe. Three consecutive sixes lose the turn. Capturing a token grants another turn.</p></div><script>
const COLORS=['red','green','yellow','blue'];const HEX={red:'#ef4444',green:'#22c55e',yellow:'#facc15',blue:'#3b82f6'};
// Clockwise route, beginning at the red entry near the red yard.
const TRACK=[[6,1],[6,2],[6,3],[6,4],[6,5],[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],[0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],[7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[14,7],[14,6],[13,6],[12,6],[11,6],[10,6],[9,6],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0],[7,0],[6,0]];
// Red starts at track 0, green at 13, yellow at 26, blue at 39.
const START={red:0,green:13,yellow:26,blue:39};
const LANES={red:Array.from({length:5},(_,i)=>[7,i+1]),green:Array.from({length:5},(_,i)=>[i+1,7]),yellow:Array.from({length:5},(_,i)=>[7,13-i]),blue:Array.from({length:5},(_,i)=>[13-i,7])};
const YARDS={red:[[1,1],[1,4],[4,1],[4,4]],green:[[1,10],[1,13],[4,10],[4,13]],yellow:[[10,10],[10,13],[13,10],[13,13]],blue:[[10,1],[10,4],[13,1],[13,4]]};
const SAFE=new Set([0,8,13,21,26,34,39,47]);
let active=[],pieces={},turn=0,roll=0,phase='roll',sixes=0,sound=true,winner=null;
const $=id=>document.getElementById(id);const key=([r,c])=>r+','+c;
const routeIndex=(color,step)=>(START[color]+step)%52;
function pos(color,step,id){if(step===-1)return YARDS[color][id];if(step<51)return TRACK[routeIndex(color,step)];if(step<56)return LANES[color][step-51];return [7,7]}
function beep(freq=440){if(!sound)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.connect(g);g.connect(a.destination);g.gain.value=.035;o.start();o.stop(a.currentTime+.1);o.onended=()=>a.close()}catch(e){}}
function message(s){$('status').textContent=s}function current(){return active[turn]}function legal(){let c=current();return pieces[c].map((v,i)=>({v,i})).filter(({v})=>v!==56&&(v===-1?roll===6:v+roll<=56)).map(x=>x.i)}
function render(){let b=$('board');b.innerHTML='';let occupants={};for(let c of active)pieces[c].forEach((step,i)=>{if(step===56)return;let k=key(pos(c,step,i));(occupants[k]??=[]).push({c,i})});let trackMap=new Map(TRACK.map((p,i)=>[key(p),i]));let laneMap=new Map();for(let c of COLORS)LANES[c].forEach(p=>laneMap.set(key(p),c));let valid=phase==='move'?legal():[];
for(let r=0;r<15;r++)for(let col=0;col<15;col++){let el=document.createElement('div'),k=r+','+col;el.className='cell';let base=(r<6||r>8)&&(col<6||col>8);if(base){let color=r<6?(col<6?'red':'green'):(col<6?'blue':'yellow');el.classList.add('base',color);if(YARDS[color].some(p=>key(p)===k)){let y=document.createElement('div');y.className='yard';el.append(y)}}else if(r>=6&&r<=8&&col>=6&&col<=8)el.classList.add('center');else if(laneMap.has(k))el.classList.add(laneMap.get(k));else if(trackMap.has(k)){let n=trackMap.get(k);if(SAFE.has(n))el.classList.add('safe');if([0,13,26,39].includes(n))el.classList.add(COLORS[[0,13,26,39].indexOf(n)])}
let occ=occupants[k]||[];if(occ.length){let wrap=document.createElement('div');wrap.className='stack';for(let {c,i} of occ){let t=document.createElement('button');t.className='token '+c+(c===current()&&valid.includes(i)?' can':'');t.style.background=HEX[c];t.textContent=i+1;t.title=c+' token '+(i+1);t.onclick=()=>move(c,i);wrap.append(t)}el.append(wrap)}b.append(el)}
$('players').innerHTML=active.map((c,i)=>`<div class="player ${i===turn?'active':''}" style="border-bottom:5px solid ${HEX[c]}">${c.toUpperCase()}<br>🏠 ${pieces[c].filter(x=>x===56).length}/4</div>`).join('');$('roll').disabled=phase!=='roll';$('mode').disabled=phase==='move';}
function next(){roll=0;sixes=0;turn=(turn+1)%active.length;phase='roll';message(current().toUpperCase()+': roll the dice');render()}
function rollDice(){if(phase!=='roll')return;roll=1+Math.floor(Math.random()*6);$('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][roll-1];beep(300+roll*70);if(roll===6)sixes++;else sixes=0;if(sixes===3){message('Three sixes! Turn forfeited.');phase='wait';render();setTimeout(next,850);return}let choices=legal();if(!choices.length){message('No legal move. Next player...');phase='wait';render();setTimeout(next,850)}else{phase='move';message(current().toUpperCase()+' rolled '+roll+'. Tap a glowing token.');render()}}
function move(c,i){if(phase!=='move'||c!==current()||!legal().includes(i))return;let old=pieces[c][i],step=old===-1?0:old+roll;pieces[c][i]=step;beep(570);let captured=false;if(step>=0&&step<51){let idx=routeIndex(c,step);if(!SAFE.has(idx)){for(let other of active)if(other!==c)for(let j=0;j<4;j++){let s=pieces[other][j];if(s>=0&&s<51&&routeIndex(other,s)===idx){pieces[other][j]=-1;captured=true}}}}if(pieces[c].every(s=>s===56)){winner=c;phase='over';message('🏆 '+c.toUpperCase()+' WINS! Start a new game.');beep(880);render();return}if(roll===6||captured){phase='roll';message(c.toUpperCase()+(captured?' captured a token!':' rolled six!')+' Roll again.');roll=0;render()}else next()}
function newGame(){active=$('mode').value==='2'?['red','yellow']:COLORS.slice();pieces=Object.fromEntries(active.map(c=>[c,[-1,-1,-1,-1]]));turn=0;roll=0;sixes=0;phase='roll';winner=null;$('dice').textContent='🎲';message('RED: roll the dice to begin!');render()}
$('roll').onclick=rollDice;$('new').onclick=newGame;$('mode').onchange=newGame;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Sound On':'🔇 Sound Off'};newGame();
</script></body></html>
