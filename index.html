<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>DROFIX LUDO</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#354b79,#10182c 75%);font-family:system-ui,Arial;color:white;min-height:100vh;display:flex;justify-content:center}main{width:min(100%,650px);padding:12px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}h1{font-size:23px;margin:0;text-shadow:0 3px 5px #0009}button{cursor:pointer;border:0;font-weight:800}.small{border-radius:12px;padding:9px 12px;background:#ffffff24;color:white}.status{background:#ffffff16;border:1px solid #ffffff33;padding:9px;border-radius:12px;text-align:center;margin-bottom:10px;font-weight:700}.board{width:100%;aspect-ratio:1;position:relative;border:3px solid white;border-radius:10px;overflow:hidden;box-shadow:0 12px 35px #0009;background:white;touch-action:manipulation}.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr)}.cell{border:0.5px solid #7779;display:flex;align-items:center;justify-content:center;color:#777;font-size:clamp(9px,3vw,22px);background:white}.red{background:#ee202b}.green{background:#009e50}.blue{background:#23aaf0}.yellow{background:#f4d21c}.base{position:absolute;width:40%;height:40%;display:flex;align-items:center;justify-content:center}.base.red{left:0;top:0}.base.green{right:0;top:0}.base.blue{left:0;bottom:0}.base.yellow{right:0;bottom:0}.nest{width:70%;height:70%;background:#fff;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:center;gap:4%;padding:9%;box-shadow:inset 0 0 0 2px #0002}.slot{width:76%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 3px 5px #0006,0 2px 2px #0003}.base.red .slot{background:#d91520}.base.green .slot{background:#008c43}.base.blue .slot{background:#159bd9}.base.yellow .slot{background:#ebc800}.center{position:absolute;left:40%;top:40%;width:20%;height:20%;background:conic-gradient(from 45deg,#f7d51a 0 25%,#24a9ef 0 50%,#ed2430 0 75%,#00a354 0);border:1px solid #6666}.piece{position:absolute;z-index:4;width:6.3%;height:7.3%;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 2px #0007);transition:left .16s ease,top .16s ease;display:flex;align-items:flex-start;justify-content:center;border:0;background:none;padding:0}.piece:before{content:'';position:absolute;top:9%;width:78%;height:80%;border-radius:55% 55% 48% 48%;background:linear-gradient(110deg,#fff,#aaa 45%,#fff 70%);clip-path:polygon(50% 100%,12% 53%,7% 33%,18% 13%,40% 2%,64% 2%,86% 15%,93% 37%,83% 60%);box-shadow:0 1px 2px #000}.piece:after{content:'';position:absolute;top:10%;width:53%;aspect-ratio:1;border-radius:50%;background:var(--color);border:2px solid #333;box-shadow:inset -3px -3px 3px #0005,0 0 0 2px #fff}.piece.can{animation:pulse .7s infinite alternate}.piece.selected{z-index:8}.piece:disabled{cursor:default}@keyframes pulse{to{filter:drop-shadow(0 0 7px #fff) drop-shadow(0 0 4px gold);transform:translate(-50%,-55%) scale(1.12)}}.controls{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#ffffff18;border-radius:15px;padding:12px;margin-top:12px}.dice{font-size:44px;width:70px;height:70px;background:white;color:#171b29;border-radius:13px;box-shadow:inset 0 -5px #ddd,0 5px 0 #0004}.dice.rolling{animation:shake .13s infinite}@keyframes shake{50%{transform:rotate(20deg) scale(1.08)}}.roll{flex:1;padding:18px 12px;border-radius:12px;background:linear-gradient(#ffe46c,#f2a500);box-shadow:0 5px 0 #ae7100;color:#442b00;font-size:18px}.roll:disabled{opacity:.45}.meta{font-size:13px;color:#dce4ff}.row{display:flex;gap:8px;align-items:center}.dot{width:15px;height:15px;border-radius:50%;display:inline-block;border:2px solid white}.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:20px}.overlay.show{display:flex}.modal{background:#26395e;border:2px solid #fff5;padding:24px;border-radius:22px;text-align:center;width:min(100%,380px);box-shadow:0 20px 60px #000}.modal h2{margin-top:0}.choice{width:100%;padding:15px;margin:7px 0;border-radius:12px;background:#ffd23d;color:#332500;font-size:17px}.note{font-size:12px;opacity:.8;text-align:center;margin-top:12px}#toast{min-height:20px;text-align:center;color:#ffe37a;font-weight:700;font-size:13px;margin-top:8px}@media(max-width:380px){main{padding:7px}.controls{padding:8px}.roll{font-size:15px}}
</style></head><body><main><header><h1>🎲 DROFIX LUDO</h1><div class="row"><button class="small" id="sound">🔊</button><button class="small" id="new">New Game</button></div></header><div class="status" id="status">Choose game mode</div><div class="board" id="board"><div class="grid" id="grid"></div><div class="base red"><div class="nest"><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i></div></div><div class="base green"><div class="nest"><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i></div></div><div class="base blue"><div class="nest"><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i></div></div><div class="base yellow"><div class="nest"><i class="slot"></i><i class="slot"></i><i class="slot"></i><i class="slot"></i></div></div><div class="center"></div></div><div class="controls"><button class="dice" id="dice" aria-label="Roll dice">⚀</button><div style="flex:1"><div class="row"><span class="dot" id="dot"></span><b id="turn">Ready</b></div><div class="meta" id="hint">Roll a 6 to bring a token out</div></div><button class="roll" id="roll">ROLL DICE</button></div><div id="toast"></div><div class="note">Local pass-and-play • Four tokens per player • Exact roll to finish</div></main><div class="overlay show" id="overlay"><div class="modal"><h2 id="modalTitle">🎲 DROFIX LUDO</h2><p id="modalText">Select your game mode</p><button class="choice" data-mode="2">2 PLAYERS (Red vs Yellow)</button><button class="choice" data-mode="4">4 PLAYERS</button></div></div><script>
const colors=['red','green','yellow','blue'],hex=['#e9232e','#009e50','#f4d21c','#21a8ef'];const path=[[6,1],[6,2],[6,3],[6,4],[6,5],[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],[0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],[7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[14,7],[14,6],[13,6],[12,6],[11,6],[10,6],[9,6],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0],[7,0],[6,0]]; // row,column
const starts=[0,13,26,39]; // red top left, green top right, yellow bottom right, blue bottom left
const lanes=[Array.from({length:5},(_,i)=>[7,1+i]),Array.from({length:5},(_,i)=>[1+i,7]),Array.from({length:5},(_,i)=>[7,13-i]),Array.from({length:5},(_,i)=>[13-i,7])];
// Correct lane assignment: red from left, green from top, yellow from right, blue from bottom
const homeLanes=[lanes[0],lanes[1],lanes[2],lanes[3]];
const bases=[[[1.9,1.9],[1.9,4.1],[4.1,1.9],[4.1,4.1]],[[1.9,10.9],[1.9,13.1],[4.1,10.9],[4.1,13.1]],[[10.9,10.9],[10.9,13.1],[13.1,10.9],[13.1,13.1]],[[10.9,1.9],[10.9,4.1],[13.1,1.9],[13.1,4.1]]];
let active=[0,2],tokens=[],turn=0,rollValue=0,rolling=false,sound=true,finished=false,chainSix=0;const $=id=>document.getElementById(id);const grid=$('grid'),board=$('board');function cellClass(r,c){if(r<6&&c<6)return'red';if(r<6&&c>8)return'green';if(r>8&&c<6)return'blue';if(r>8&&c>8)return'yellow';if(r===7&&c>=1&&c<=5)return'red';if(c===7&&r>=1&&r<=5)return'green';if(r===7&&c>=9&&c<=13)return'yellow';if(c===7&&r>=9&&r<=13)return'blue';if(r===6&&c===1)return'red';if(r===1&&c===8)return'green';if(r===8&&c===13)return'yellow';if(r===13&&c===6)return'blue';return''}for(let r=0;r<15;r++)for(let c=0;c<15;c++){let el=document.createElement('div');el.className='cell '+cellClass(r,c);if([[2,6],[6,12],[8,2],[12,8]].some(x=>x[0]===r&&x[1]===c))el.textContent='☆';if([[0,7],[7,0],[7,14],[14,7]].some(x=>x[0]===r&&x[1]===c))el.textContent= r===0?'↓':r===14?'↑':c===0?'→':'←';grid.append(el)}
function audio(freq=550,duration=.09){if(!sound)return;try{const ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.11,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);o.start();o.stop(ac.currentTime+duration);o.onended=()=>ac.close()}catch(e){}}
function position(t){if(t.step<0)return bases[t.p][t.id];if(t.step>=57)return [7,7];if(t.step>=51)return homeLanes[t.p][t.step-51];return path[(starts[t.p]+t.step)%52]}
function render(){document.querySelectorAll('.piece').forEach(x=>x.remove());tokens.forEach(t=>{let [r,c]=position(t),el=document.createElement('button');el.className='piece';el.style.setProperty('--color',hex[t.p]);el.style.top=((r+.5)/15*100)+'%';el.style.left=((c+.5)/15*100)+'%';el.title=colors[t.p]+' token '+(t.id+1);el.setAttribute('aria-label',el.title);if(rollValue&&t.p===active[turn]&&valid(t))el.classList.add('can');el.onclick=()=>move(t);board.append(el)});$('turn').textContent=colors[active[turn]].toUpperCase()+ ' TURN';$('dot').style.background=hex[active[turn]];$('status').textContent=finished?'Game over':rollValue?'Choose a glowing token • Rolled '+rollValue:colors[active[turn]].toUpperCase()+' player — roll the dice';$('hint').textContent=rollValue?'Tap a glowing token':'Roll 6 to release a token';$('roll').disabled=rolling||!!rollValue||finished;$('dice').disabled=rolling||!!rollValue||finished}
function valid(t){return t.step!==57&&(t.step===-1?rollValue===6:t.step+rollValue<=57)}function next(){rollValue=0;chainSix=0;turn=(turn+1)%active.length;render()}function toast(s){$('toast').textContent=s}function roll(){if(rolling||rollValue||finished)return;rolling=true;$('roll').disabled=true;$('dice').classList.add('rolling');let n=0;let timer=setInterval(()=>{$('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random()*6)];audio(350+n*18,.025);if(++n>=12){clearInterval(timer);rolling=false;$('dice').classList.remove('rolling');rollValue=1+Math.floor(Math.random()*6);$('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][rollValue-1];audio(760,.2);if(rollValue===6)chainSix++;if(chainSix===3){toast('Three sixes! Turn skipped');next();return}render();if(!tokens.some(t=>t.p===active[turn]&&valid(t))){toast('No possible move — next player');setTimeout(()=>{if(!finished){if(rollValue===6){rollValue=0;render()}else next()}},850)}else toast(rollValue===6?'Six! Bring out or move a token':'Tap a glowing token')}},55)}
function move(t){if(rolling||!rollValue||t.p!==active[turn]||!valid(t)||finished)return;let steps=t.step<0?1:rollValue,from=t.step,rolled=rollValue;rollValue=0;render();let i=0;function hop(){if(i++<steps){t.step=from<0?0:from+i;audio(420+i*55,.07);render();setTimeout(hop,145)}else{let capture=false;if(t.step<51){let pos=(starts[t.p]+t.step)%52;let safe=[0,8,13,21,26,34,39,47].includes(pos);if(!safe)tokens.forEach(other=>{if(other.p!==t.p&&other.step>=0&&other.step<51&&(starts[other.p]+other.step)%52===pos){other.step=-1;capture=true;audio(180,.25)}})}if(tokens.filter(x=>x.p===t.p).every(x=>x.step===57)){finished=true;$('modalTitle').textContent='🏆 '+colors[t.p].toUpperCase()+' WINS!';$('modalText').textContent='Amazing game! Play again?';$('overlay').classList.add('show');audio(900,.4)}else if(rolled===6||capture||t.step===57){toast(capture?'Token captured! Bonus turn':t.step===57?'Token home! Bonus turn':'Six! Roll again');rollValue=0}else{turn=(turn+1)%active.length;chainSix=0;toast('Next player')}render()}}hop()}
function start(mode){active=mode===2?[0,2]:[0,1,2,3];tokens=colors.flatMap((_,p)=>Array.from({length:4},(_,id)=>({p,id,step:-1})));turn=0;rollValue=0;rolling=false;finished=false;chainSix=0;$('dice').textContent='⚀';$('overlay').classList.remove('show');toast('Roll a 6 to start!');render()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(+b.dataset.mode));$('roll').onclick=roll;$('dice').onclick=roll;$('new').onclick=()=>{$('modalTitle').textContent='🎲 DROFIX LUDO';$('modalText').textContent='Select your game mode';$('overlay').classList.add('show')};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇'};
</script></body></html>
